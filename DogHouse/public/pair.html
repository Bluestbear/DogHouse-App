<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pair up on DogHouse</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           max-width: 480px; margin: 0 auto; padding: 32px 24px; line-height: 1.5; color: #2b2b2b; text-align: center; }
    h1 { color: #8a5a2b; font-size: 1.6em; margin-bottom: 8px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 2.2em; letter-spacing: 0.25em;
            font-weight: 700; color: #8a5a2b; margin: 24px 0; }
    .btn { display: block; padding: 14px 20px; margin: 12px 0; border-radius: 14px; text-decoration: none;
           font-weight: 600; font-size: 1.05em; }
    .primary { background: #e8853a; color: #fff; }
    .secondary { background: #f2ece4; color: #8a5a2b; }
    .hint { color: #777; font-size: 0.9em; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>🐕 Your partner wants to pair up</h1>
  <p>Open DogHouse and the code fills itself in. If you don't have the app yet, install it first and then tap this link again.</p>
  <div class="code" id="code">------</div>
  <a class="btn primary" id="open" href="#">Open in DogHouse</a>
  <a class="btn secondary" id="store" href="https://apps.apple.com/app/doghouse">Get DogHouse on the App Store</a>
  <p class="hint">Or type the code on the “Pair Up” screen. Codes never contain O, 0, I or 1.</p>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var code = (parts[1] || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
      if (code.length === 6) {
        document.getElementById("code").textContent = code;
        document.getElementById("open").href = "doghouse://pair/" + code;
      } else {
        document.getElementById("open").style.display = "none";
      }
    })();
  </script>
</body>
</html>
